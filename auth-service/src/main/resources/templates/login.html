<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <style type="text/tailwindcss">
    @theme inline {
        --font-heading: var(--font-sans);
        --font-sans: 'Inter Variable', sans-serif;
        --color-sidebar-ring: var(--sidebar-ring);
        --color-sidebar-border: var(--sidebar-border);
        --color-sidebar-accent-foreground: var(--sidebar-accent-foreground);
        --color-sidebar-accent: var(--sidebar-accent);
        --color-sidebar-primary-foreground: var(--sidebar-primary-foreground);
        --color-sidebar-primary: var(--sidebar-primary);
        --color-sidebar-foreground: var(--sidebar-foreground);
        --color-sidebar: var(--sidebar);
        --color-chart-5: var(--chart-5);
        --color-chart-4: var(--chart-4);
        --color-chart-3: var(--chart-3);
        --color-chart-2: var(--chart-2);
        --color-chart-1: var(--chart-1);
        --color-ring: var(--ring);
        --color-input: var(--input);
        --color-border: var(--border);
        --color-destructive: var(--destructive);
        --color-accent-foreground: var(--accent-foreground);
        --color-accent: var(--accent);
        --color-muted-foreground: var(--muted-foreground);
        --color-muted: var(--muted);
        --color-secondary-foreground: var(--secondary-foreground);
        --color-secondary: var(--secondary);
        --color-primary-foreground: var(--primary-foreground);
        --color-primary: var(--primary);
        --color-popover-foreground: var(--popover-foreground);
        --color-popover: var(--popover);
        --color-card-foreground: var(--card-foreground);
        --color-card: var(--card);
        --color-foreground: var(--foreground);
        --color-background: var(--background);
        --radius-sm: calc(var(--radius) * 0.6);
        --radius-md: calc(var(--radius) * 0.8);
        --radius-lg: var(--radius);
        --radius-xl: calc(var(--radius) * 1.4);
        --radius-2xl: calc(var(--radius) * 1.8);
        --radius-3xl: calc(var(--radius) * 2.2);
        --radius-4xl: calc(var(--radius) * 2.6);
    }

    :root {
        --background: oklch(1 0 0);
        --foreground: oklch(0.141 0.005 285.823);
        --card: oklch(1 0 0);
        --card-foreground: oklch(0.141 0.005 285.823);
        --popover: oklch(1 0 0);
        --popover-foreground: oklch(0.141 0.005 285.823);
        --primary: oklch(0.508 0.118 165.612);
        --primary-foreground: oklch(0.979 0.021 166.113);
        --secondary: oklch(0.967 0.001 286.375);
        --secondary-foreground: oklch(0.21 0.006 285.885);
        --muted: oklch(0.967 0.001 286.375);
        --muted-foreground: oklch(0.552 0.016 285.938);
        --accent: oklch(0.967 0.001 286.375);
        --accent-foreground: oklch(0.21 0.006 285.885);
        --destructive: oklch(0.577 0.245 27.325);
        --border: oklch(0.92 0.004 286.32);
        --input: oklch(0.92 0.004 286.32);
        --ring: oklch(0.705 0.015 286.067);
        --chart-1: oklch(0.845 0.143 164.978);
        --chart-2: oklch(0.696 0.17 162.48);
        --chart-3: oklch(0.596 0.145 163.225);
        --chart-4: oklch(0.508 0.118 165.612);
        --chart-5: oklch(0.432 0.095 166.913);
        --radius: 0.45rem;
        --sidebar: oklch(0.985 0 0);
        --sidebar-foreground: oklch(0.141 0.005 285.823);
        --sidebar-primary: oklch(0.596 0.145 163.225);
        --sidebar-primary-foreground: oklch(0.979 0.021 166.113);
        --sidebar-accent: oklch(0.967 0.001 286.375);
        --sidebar-accent-foreground: oklch(0.21 0.006 285.885);
        --sidebar-border: oklch(0.92 0.004 286.32);
        --sidebar-ring: oklch(0.705 0.015 286.067);
    }

    .dark {
        --background: oklch(0.141 0.005 285.823);
        --foreground: oklch(0.985 0 0);
        --card: oklch(0.21 0.006 285.885);
        --card-foreground: oklch(0.985 0 0);
        --popover: oklch(0.21 0.006 285.885);
        --popover-foreground: oklch(0.985 0 0);
        --primary: oklch(0.432 0.095 166.913);
        --primary-foreground: oklch(0.979 0.021 166.113);
        --secondary: oklch(0.274 0.006 286.033);
        --secondary-foreground: oklch(0.985 0 0);
        --muted: oklch(0.274 0.006 286.033);
        --muted-foreground: oklch(0.705 0.015 286.067);
        --accent: oklch(0.274 0.006 286.033);
        --accent-foreground: oklch(0.985 0 0);
        --destructive: oklch(0.704 0.191 22.216);
        --border: oklch(1 0 0 / 10%);
        --input: oklch(1 0 0 / 15%);
        --ring: oklch(0.552 0.016 285.938);
        --chart-1: oklch(0.845 0.143 164.978);
        --chart-2: oklch(0.696 0.17 162.48);
        --chart-3: oklch(0.596 0.145 163.225);
        --chart-4: oklch(0.508 0.118 165.612);
        --chart-5: oklch(0.432 0.095 166.913);
        --sidebar: oklch(0.21 0.006 285.885);
        --sidebar-foreground: oklch(0.985 0 0);
        --sidebar-primary: oklch(0.696 0.17 162.48);
        --sidebar-primary-foreground: oklch(0.262 0.051 172.552);
        --sidebar-accent: oklch(0.274 0.006 286.033);
        --sidebar-accent-foreground: oklch(0.985 0 0);
        --sidebar-border: oklch(1 0 0 / 10%);
        --sidebar-ring: oklch(0.552 0.016 285.938);
    }
  </style>
  <title>Sign in</title>
</head>

<body class="bg-muted h-screen flex items-center justify-center">
  <div
    class="flex flex-col gap-(--card-spacing) rounded-xl bg-card text-sm text-card-foreground ring-1 ring-foreground/10 py-(--card-spacing) [--card-spacing:--spacing(4)] has-data-[slot=card-footer]:pb-0">
    <div class="grid auto-rows-min items-start gap-1 rounded-t-xl px-(--card-spacing) [.border-b]:pb-(--card-spacing)">
      <div class="cn-font-heading text-base leading-snug font-medium">Sign in to HIS Inc.</div>
    </div>

    <div class="px-(--card-spacing)">
      <form method="post" action="/login" id="login-form">
          <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
        <div class="w-full flex flex-col gap-5">
          <div class="w-full flex flex-col gap-2">
            <label for="username" class="flex w-fit gap-2 leading-snug">Username</label>
            <input id="username" name="username" type="text"
              class="h-8 w-full min-w-0 rounded-lg border border-input bg-transparent px-2.5 py-1 text-base transition-colors outline-none placeholder:text-muted-foreground focus-visible:border-ring focus-visible:ring-3 focus-visible:ring-ring/50" />
          </div>
          <div class="w-full flex flex-col gap-2">
            <label for="password" class="flex w-fit gap-2 leading-snug">Password</label>
            <input id="password" name="password" type="password"
              class="h-8 w-full min-w-0 rounded-lg border border-input bg-transparent px-2.5 py-1 text-base transition-colors outline-none placeholder:text-muted-foreground focus-visible:border-ring focus-visible:ring-3 focus-visible:ring-ring/50" />
          </div>
        </div>
      </form>

    </div>

    <div data-slot="card-footer"
      class="flex items-center justify-end rounded-b-xl border-t border-foreground/10 bg-muted/50 p-(--card-spacing)">
      <button type="submit" form="login-form"
        class="inline-flex shrink-0 items-center justify-center rounded-lg border border-transparent bg-clip-padding text-sm font-medium whitespace-nowrap transition-all outline-none select-none focus-visible:border-ring focus-visible:ring-3 focus-visible:ring-ring/50 active:not-aria-[haspopup]:translate-y-px disabled:pointer-events-none disabled:opacity-50 aria-invalid:border-destructive aria-invalid:ring-3 aria-invalid:ring-destructive/20 dark:aria-invalid:border-destructive/50 dark:aria-invalid:ring-destructive/40 [&_svg]:pointer-events-none [&_svg]:shrink-0 [&_svg:not([class*='size-'])]:size-4 bg-primary text-primary-foreground hover:bg-primary/80 h-8 gap-1.5 px-2.5 has-data-[icon=inline-end]:pr-2 has-data-[icon=inline-start]:pl-2">Sign
        in</button>
    </div>
  </div>

</body>

</html>
